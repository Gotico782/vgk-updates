server {
    listen 80;
    server_name takepeek.cloud supremacy.cloud _;
    location / {
        proxy_pass https://172.67.179.14;
        proxy_set_header Host supremacy.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name supremacy.cloud;
    }
}
server {
    listen 443 ssl;
    server_name takepeek.cloud;
    ssl_certificate /etc/letsencrypt/live/takepeek.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/takepeek.cloud/privkey.pem;
    location / {
        proxy_pass https://172.67.179.14;
        proxy_set_header Host supremacy.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name supremacy.cloud;
    }
}
server {
    listen 443 ssl;
    server_name supremacy.cloud _;
    ssl_certificate /etc/nginx/ssl/supremacy.crt;
    ssl_certificate_key /etc/nginx/ssl/supremacy.key;
    location / {
        proxy_pass https://172.67.179.14;
        proxy_set_header Host supremacy.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name supremacy.cloud;
    }
}
