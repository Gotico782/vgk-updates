server {
    listen 80;
    server_name _;
    location /v1/session {
        default_type application/json;
        return 200 '{"status":"success","uuid":"00000000-0000-0000-0000-000000000001","position":0,"queuePos":0,"activeUsers":1,"totalSlots":100,"loadingPct":100,"vanguardVersion":"1.0.0"}';
    }
    location / {
        proxy_pass https://172.67.179.14;
        proxy_set_header Host supremacy.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name supremacy.cloud;
    }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    location /v1/session {
        default_type application/json;
        return 200 '{"status":"success","uuid":"00000000-0000-0000-0000-000000000001","position":0,"queuePos":0,"activeUsers":1,"totalSlots":100,"loadingPct":100,"vanguardVersion":"1.0.0"}';
    }
    location / {
        proxy_pass https://172.67.179.14;
        proxy_set_header Host supremacy.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name supremacy.cloud;
    }
}
